<script>
(() => {
  const overlay = document.getElementById('loader');
  const sign = document.getElementById('loader-sign');
  const glyphs = [...sign.querySelectorAll('.sign-glyph')];
  for (const glyph of glyphs) {
    const core = glyph.querySelector('path').cloneNode();
    core.classList.add('tube-core');
    glyph.append(core);
  }
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let finished = false, finishing = false, failed = false, progress = 0;
  const effectTimers = new Set();
  if (!reduced) {
    let offset = -Math.min(innerHeight * .5, 480), velocity = 0;
    let tilt = -.14, angularVelocity = 0, lastFrame = 0;
    function moveSign(time) {
      if (finished) return;
      const dt = Math.min((time - (lastFrame || time)) / 1000, .033);
      lastFrame = time;
      velocity += (-70 * offset - 13 * velocity) * dt;
      offset += velocity * dt;
      angularVelocity += (-28 * tilt - 6 * angularVelocity) * dt;
      tilt += angularVelocity * dt;
      const idleSway = Math.sin(time / 1050) * .004;
      sign.style.transform = `translateY(${offset.toFixed(2)}px) rotate(${(tilt + idleSway - Math.PI / 180).toFixed(4)}rad)`;
      requestAnimationFrame(moveSign);
    }
    requestAnimationFrame(moveSign);
  }

  function later(fn, delay) {
    const timer = setTimeout(() => { effectTimers.delete(timer); fn(); }, delay);
    effectTimers.add(timer);
  }
  function clearEffects() {
    for (const timer of effectTimers) clearTimeout(timer);
    effectTimers.clear();
    sign.classList.remove('power-cut', 'brownout');
    for (const glyph of glyphs) glyph.classList.remove('fault');
  }

  function queueFlicker() {
    if (reduced || failed || finishing || finished || progress < 35 || effectTimers.size) return;
    const interval = progress >= 85 ? 580 + Math.random() * 850 : 240 + Math.random() * 500;
    later(() => {
      const event = Math.random();
      if (event < .48) {
        const first = glyphs[Math.floor(Math.random() * glyphs.length)];
        first.classList.add('fault');
        if (Math.random() < .35) glyphs[(glyphs.indexOf(first) + 1) % glyphs.length].classList.add('fault');
        later(() => { for (const glyph of glyphs) glyph.classList.remove('fault'); queueFlicker(); }, 90 + Math.random() * 180);
      } else if (event < .86) {
        sign.style.setProperty('--brownout-level', (.12 + Math.random() * .22).toFixed(2));
        sign.classList.add('brownout');
        later(() => { sign.classList.remove('brownout'); queueFlicker(); }, 150 + Math.random() * 270);
      } else {
        sign.classList.add('power-cut');
        later(() => { sign.classList.remove('power-cut'); queueFlicker(); }, 45 + Math.random() * 75);
      }
    }, interval);
  }
  window.streetLoading = {
    update(value, label) {
      if (failed) return;
      progress = Math.max(progress, Math.min(100, Math.round(value)));
      document.getElementById('loader-fill').style.width = `${progress}%`;
      document.getElementById('loader-percent').textContent = `${progress}%`;
      overlay.querySelector('[role="progressbar"]').setAttribute('aria-valuenow', progress);
      document.getElementById('loader-status').textContent = label;
      sign.classList.toggle('charge-mid', progress >= 35 && progress < 85);
      sign.classList.toggle('charge-full', progress >= 85);
      queueFlicker();
    },
    finish() {
      if (failed || finishing) return;
      this.update(100, 'READY');
      finishing = true;
      clearEffects();
      if (!reduced) {
        later(() => sign.classList.add('brownout'), 120);
        later(() => sign.classList.remove('brownout'), 340);
        later(() => sign.classList.add('power-cut'), 470);
        later(() => sign.classList.remove('power-cut'), 545);
      }
      later(() => overlay.classList.add('done'), reduced ? 0 : 800);
      later(() => { overlay.hidden = true; finished = true; sign.style.willChange = 'auto'; clearEffects(); }, reduced ? 0 : 1180);
    },
    fail() {
      failed = true;
      clearEffects();
      document.getElementById('loader-status').textContent = 'CONNECTION FAILED';
      document.getElementById('loader-retry').hidden = false;
    }
  };
  document.getElementById('loader-retry').addEventListener('click', () => location.reload());
  addEventListener('error', () => window.streetLoading.fail());
  addEventListener('unhandledrejection', () => window.streetLoading.fail());
})();
</script>

    for (let k = 0; k < 6; k++) place(pick(['SM_Prop_Light_Stage_01', 'SM_Prop_Light_Stage_02', 'SM_Prop_Light_Stage_03']), s * (3 + k * 2.2), 24.6, ze - 4, Math.PI, 3);
  }
  for (let k = -3; k <= 3; k++) place('SM_Prop_Gantry_01', k * 5, 25, ze - 4, Math.PI / 2, 2);     // 顶梁（横放的立柱）
  place('SM_Prop_DJ_Booth_01', 0, 0.2, ze + 6, 0, 3);
  place('SM_Prop_Sculpture_03', 0, 0.2, ze - 14, 0, 4);

  // 巨型迪斯科球（单独 Mesh，要转）
  const ballProto = protos['SM_Prop_Disco_Ball_01'];
  if (ballProto) {
    const ball = new THREE.Mesh(ballProto.geo, new THREE.MeshToonMaterial({ map: ballProto.mat.map, gradientMap: gradient, emissive: 0x7fe9ff, emissiveMap: ballProto.mat.map, emissiveIntensity: 1.4 }));
    ball.scale.setScalar(11); ball.position.set(0, 15, ze - 2); world.add(ball);
    animated.push(dt => { ball.rotation.y += dt * 0.25; });
  }
  // 三个发光环，不同倾角各自转
  const ringCols = [glowColor(-1), glowColor(1), new THREE.Color(COL.cyan).multiplyScalar(1.1)];
  ringCols.forEach((c, i) => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(8 + i * 2.6, 0.12, 8, 96), new THREE.MeshBasicMaterial({ color: c }));
    ring.position.set(0, 14, ze - 2); ring.rotation.set(0.5 + i * 0.6, 0, 0.3 * i);
    world.add(ring);
    animated.push(dt => { ring.rotation.z += dt * (0.25 + i * 0.12); ring.rotation.x += dt * 0.08; });
  });
  // 废弃物堆：按圆丘分布把杂物一层层堆上去，越靠中心越高
  const PILE = ['SM_Prop_Dumpster_01', 'SM_Prop_Pallet_01', 'SM_Prop_Box_Stack_01', 'SM_Prop_Box_Stack_02', 'SM_Prop_Box_Stack_03', 'SM_Prop_TrashBag_01', 'SM_Prop_TrashBag_01',
                'SM_Prop_Rubbish_Bin_01', 'SM_Prop_Speaker_01', 'SM_Prop_Speaker_Large_01', 'SM_Prop_Pipes_01_Mesh', 'SM_Prop_Venting_End_01', 'SM_Prop_AirVent_01',
                'SM_Prop_TV_01', 'SM_Prop_Display_Board_02', 'SM_Prop_Planter_01', 'SM_Prop_Pallet_01', 'SM_Prop_Box_Stack_02'];
  const R = 13;
  for (let i = 0; i < 170; i++) {
    const r = Math.sqrt(seed()) * R, a = seed() * Math.PI * 2;
    const x = Math.cos(a) * r, z = ze + 2 + Math.sin(a) * r * 0.8;
    const h = Math.max(0, 1 - r / R);                       // 圆丘：中心高 7 米，边缘贴地
    const y = h * h * 7 + seed() * 0.6;
    place(pick(PILE), x, y, z, seed() * Math.PI * 2, 1.2 + seed() * 0.8);
  }
  // 堆前面的补光：底部两侧两盏强光 + 一圈贴地的发光底线
  for (const s of [-1, 1]) {
    const fl = new THREE.PointLight(s < 0 ? COL.yellow : COL.magenta, 10, 32, 1.6); fl.position.set(s * 12, 1.2, ze + 16); world.add(fl);
    const fl2 = new THREE.PointLight(0xfff0c0, 4, 24, 1.6); fl2.position.set(s * 5, 3, ze + 12); world.add(fl2);
  }
  const baseRing = new THREE.Mesh(new THREE.TorusGeometry(R + 1.5, 0.1, 6, 80), new THREE.MeshBasicMaterial({ color: glowColor(1) }));
  baseRing.rotation.x = Math.PI / 2; baseRing.position.set(0, 0.25, ze + 2); baseRing.scale.set(1, 0.8, 1); world.add(baseRing);
  const baseLine = new THREE.Mesh(new THREE.BoxGeometry(2 * R + 8, 0.08, 0.3), new THREE.MeshBasicMaterial({ color: glowColor(-1) }));
  baseLine.position.set(0, 0.26, ze + 16); world.add(baseLine);
  // 几块歪倒的招牌插在堆里
  // 堆里的招牌：避开白底的，单独用一份弱自发光材质（废弃的灯只剩一点余光）
  const SIGNS2 = Object.keys(protos).filter(n => /Sign_/.test(n) && !/Exit|Sign_Bar_01|Escape|White_Cloud|Diamond/.test(n));
  const dimSign = protos[SIGNS2[0]].mat.clone(); dimSign.emissiveIntensity = 0.35;
  for (let i = 0; i < 5; i++) {
    const r = 4 + seed() * 8, a = seed() * Math.PI * 2, p = protos[pick(SIGNS2)];
    const m = new THREE.Mesh(p.geo, dimSign);
    m.position.set(Math.cos(a) * r, 1 + seed() * 4, ze + 2 + Math.sin(a) * r * 0.8);
    m.rotation.set((seed() - 0.5) * 0.8, seed() * Math.PI * 2, (seed() - 0.5) * 0.6);   // 歪着插
    m.scale.setScalar(2.2 + seed() * 1.2); world.add(m);
  }
  // 舞台背景大屏
  const stageLight = new THREE.PointLight(COL.magenta, 40, 60, 1.5); stageLight.position.set(0, 10, ze); world.add(stageLight);
  const stageLight2 = new THREE.PointLight(COL.yellow, 30, 60, 1.5); stageLight2.position.set(0, 22, ze - 6); world.add(stageLight2);

  // 生成 InstancedMesh（本体 + 细描边）
  for (const [name, mats] of Object.entries(placements)) {
    const p = protos[name];
    const im = new THREE.InstancedMesh(p.geo, p.mat, mats.length);
    const io = new THREE.InstancedMesh(p.geo, outlineMat, mats.length);
    const bigOne = p.size.y > 20;
    mats.forEach((m, i) => {
      im.setMatrixAt(i, m);
      tmpM.copy(m).decompose(tmpP, tmpQ, tmpS); tmpS.multiplyScalar(bigOne ? 1.006 : 1.018); io.setMatrixAt(i, tmpM.compose(tmpP, tmpQ, tmpS));
    });
    im.castShadow = bigOne; im.receiveShadow = true;
    world.add(im, io);
  }
}

let modelProgress = 0, imagesLoaded = 0;
const imageTotal = STOPS.filter(st => st.img && !st.kind).length;
function updateLoading() {
  window.streetLoading.update(5 + modelProgress * 65 + imagesLoaded / imageTotal * 20, 'LOADING ASSETS');
}
function loadCity() {
  return new Promise((resolve, reject) => {
    new GLTFLoader().load('models/city.glb', gltf => {
      const toonByMat = {};
      gltf.scene.traverse(o => {
        if (!o.isMesh) return;
        const src = o.material;
        if (!toonByMat[src.name]) {
          const isBld = src.name === 'Buildings';
          if (src.map) src.map.colorSpace = THREE.SRGBColorSpace;
          toonByMat[src.name] = new THREE.MeshToonMaterial({ map: src.map, gradientMap: gradient, emissive: 0xffffff, emissiveMap: src.emissiveMap, emissiveIntensity: isBld ? 1.1 : 1.8 });
        }
        const geo = o.geometry; geo.computeBoundingBox();
        const b = geo.boundingBox, size = new THREE.Vector3(); b.getSize(size);
        geo.translate(-(b.min.x + b.max.x) / 2, -b.min.y, -(b.min.z + b.max.z) / 2);
        protos[o.name] = { geo, mat: toonByMat[src.name], size };
      });
      resolve();
    }, event => { if (event.total) { modelProgress = event.loaded / event.total; updateLoading(); } }, reject);
  });
}

/* ====================== 作品面板 ====================== */
const loader = new THREE.TextureLoader();
const panelLoads = [];
function reflectionTexture(image) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 288;
  const context = c.getContext('2d');
  context.filter = 'blur(7px)'; context.drawImage(image, -14, -14, 540, 316);
  const texture = new THREE.CanvasTexture(c); texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
const panels = [];
const PW = 8.0, PH = 4.5;                                  // 画面尺寸（米）
const panelGeo = new THREE.PlaneGeometry(PW, PH);
const frameGeo = new THREE.BoxGeometry(PW + 0.5, PH + 0.5, 0.25);
const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 3.4, 8);
function withOutline(mesh, t = 0.015) { const o = new THREE.Mesh(mesh.geometry, outlineMat); o.scale.setScalar(1 + t); mesh.add(o); return mesh; }

function labelTexture(st, idx) {
  const c = document.createElement('canvas'); c.width = 1280; c.height = 170;
  const g = c.getContext('2d');                                     // 透明底，只有文字和一道色条
  const col = idx % 2 === 0 ? '#fcee0a' : '#ff2a6d';
  g.fillStyle = col; g.fillRect(0, 0, 10, 170);
  g.fillStyle = col; g.font = '600 26px "Space Grotesk", sans-serif';
  g.fillText(st.kind === 'home' ? 'HOME  ·  PORTFOLIO' : `${String(idx).padStart(2, '0')}  ·  ${(st.type || '').toUpperCase()}`, 36, 56);
  g.fillStyle = '#e6e9f5'; g.font = '700 64px "Space Grotesk", sans-serif'; g.fillText(st.title, 36, 132);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

STOPS.forEach((st, i) => {
  if (st.kind === 'end' || st.kind === 'home') return;               // 主页站只有居中文字，尽头站看装置
  const side = i % 2 === 0 ? -1 : 1;
  const g = new THREE.Group();
  g.position.set(side * SIDE, 3.6, -i * SPACING);
  g.userData = { index: i, href: st.href || 'index.html', side, focus: 0 };

  const frame = withOutline(new THREE.Mesh(frameGeo, frameMat)); frame.castShadow = true; g.add(frame);
  const edge = new THREE.Mesh(new THREE.BoxGeometry(PW + 0.3, PH + 0.3, 0.06), new THREE.MeshBasicMaterial({ color: glowColor(side) }));
  edge.position.z = 0.13; g.add(edge);
  const mat = new THREE.MeshBasicMaterial({ color: 0x1b1a2a, side: THREE.DoubleSide });
  const screen = new THREE.Mesh(panelGeo, mat); screen.position.z = 0.21; g.add(screen);
  if (st.img) panelLoads.push(loader.loadAsync(st.img).then(t => {
    t.colorSpace = THREE.SRGBColorSpace; mat.map = t; mat.color.set(0xd0d0d0); mat.needsUpdate = true;
    screen.userData.displayMap = t;
    if (mirror) {
      screen.userData.reflectionMap = reflectionTexture(t.image); reflectionScreens.push(screen);
    }
    imagesLoaded++; updateLoading();
  }));
  else {
    const c = document.createElement('canvas'); c.width = 512; c.height = 288;
    const context = c.getContext('2d'); context.fillStyle = '#140b24'; context.fillRect(0, 0, 512, 288);
    context.strokeStyle = '#00f0ff'; context.lineWidth = 4;
    for (let k = 0; k < 14; k++) { context.beginPath(); context.ellipse(256, 144, 25 + k * 15, 18 + k * 8, k * .18, 0, Math.PI * 2); context.stroke(); }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; mat.map = t; mat.color.set(0xd0d0d0);
    screen.userData.displayMap = t;
    if (mirror) { screen.userData.reflectionMap = reflectionTexture(c); reflectionScreens.push(screen); }
  }

  const label = new THREE.Mesh(new THREE.PlaneGeometry(PW, PW * 170 / 1280), new THREE.MeshBasicMaterial({ map: labelTexture(st, i), transparent: true, depthWrite: false }));
  label.position.set(0, PH / 2 + 0.95, 0.14); g.add(label);

  const pole = withOutline(new THREE.Mesh(poleGeo, frameMat), 0.02); pole.position.y = -PH / 2 - 1.7; g.add(pole);
  const glow = new THREE.PointLight(sideColor(side), 5, 16, 1.7); glow.position.set(0, -1.5, 3); g.add(glow);

  Object.assign(screen.userData, g.userData); frame.userData = edge.userData = g.userData;
  g.userData.edge = edge; g.userData.glow = glow;
  world.add(g); panels.push(g);
});

/* ====================== 后期 ====================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.7, 0.7);
if (!MOBILE) composer.addPass(bloom);
const stylize = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    float bayer(vec2 p){ int x = int(mod(p.x,4.0)); int y = int(mod(p.y,4.0)); int i = x + y*4;
      int m[16]; m[0]=0;m[1]=8;m[2]=2;m[3]=10;m[4]=12;m[5]=4;m[6]=14;m[7]=6;m[8]=3;m[9]=11;m[10]=1;m[11]=9;m[12]=15;m[13]=7;m[14]=13;m[15]=5;
      for(int k=0;k<16;k++){ if(k==i) return float(m[k])/16.0; } return 0.0; }
    void main(){
      vec2 uv = vUv; vec2 d = (uv - 0.5) * 0.0012;
      vec3 c = vec3(texture2D(tDiffuse, uv + d).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - d).b);
      float levels = 16.0; float n = bayer(gl_FragCoord.xy) - 0.5;
      c = floor(c * levels + n * 0.6) / levels;
      // 暗角：中心不动，四角压到 15% 左右
      float v = 1.0 - smoothstep(0.32, 0.78, length(uv - 0.5)); c *= mix(0.12, 1.0, v);
      c *= 0.97 + 0.03 * sin(gl_FragCoord.y * 1.6);
      gl_FragColor = vec4(c, 1.0);
    }`
});
if (!MOBILE) composer.addPass(stylize);
composer.addPass(new OutputPass());

/* ====================== 相机：直线平推 ====================== */
let camT = 0, camTarget = 0;
const MAX_T = N - 1;
const mouse = new THREE.Vector2(0, 0), mouseS = new THREE.Vector2(0, 0);
const look = new THREE.Vector3();
function updateCamera(dt) {
  camT += (camTarget - camT) * Math.min(1, dt * 5);
  mouseS.lerp(mouse, 0.06);
  const z = -camT * SPACING;
  // 最后一站：停远一点、抬头看装置
  const endF = Math.max(0, camT - (N - 2));
  const homeF = Math.max(0, 1 - camT);                 // 主页站：抬高相机、看向上空，面板落到画面下方，不压文字
  camera.position.set(mouseS.x * 0.45, 3.6 + mouseS.y * 0.2 + endF * 2.5 + homeF * 8, z + 14);
  look.set(mouseS.x * 0.9, 3.8 + mouseS.y * 0.4 + endF * 6 + homeF * 18, z - 40);
  camera.lookAt(look);
  key.position.set(camera.position.x - 12, 30, camera.position.z - 10); key.target.position.set(0, 0, camera.position.z - 20);
  rain.position.set(0, 0, camera.position.z - 15);
  // 主页站："停电"：只压暗、降饱和，不模糊（HUD 是 DOM，不在 canvas 上，不受影响）
  const bright = (1 - homeF * 0.6).toFixed(2);
  const f = homeF > 0.01 ? `brightness(${bright}) saturate(${(1 - homeF * 0.4).toFixed(2)})` : '';
  if (renderer.domElement.style.filter !== f) renderer.domElement.style.filter = f;
  renderer.toneMappingExposure = 1.05 - homeF * 0.5;
  bloom.strength = 0.5 - homeF * 0.3;
}
function updatePanels(dt) {
  for (const g of panels) {
    const u = g.userData, want = Math.max(0, 1 - Math.abs(camT - u.index) * 1.25);
    u.focus += (want - u.focus) * Math.min(1, dt * 6);
    const f = u.focus, s = u.side;
    g.position.x = s * THREE.MathUtils.lerp(SIDE, SIDE_FOCUS, f);
    g.position.y = 3.6 + 0.3 * f;
    g.rotation.y = s * THREE.MathUtils.lerp(-0.85, 0, f);
    g.scale.setScalar(1 + 0.1 * f);
    u.edge.material.color.copy(glowColor(s)).multiplyScalar(1 + 0.35 * f);   // 聚焦只加亮，不改色相
    u.glow.intensity = 4 + 10 * f;
  }
}
function move(d) { if (!document.getElementById('loader').hidden) return; camTarget = Math.min(MAX_T, Math.max(0, camTarget + d)); }
function snap() { camTarget = Math.round(camTarget); }
let snapTimer = 0;
addEventListener('wheel', e => { e.preventDefault(); move(-e.deltaY / 420); clearTimeout(snapTimer); snapTimer = setTimeout(snap, 140); }, { passive: false });   // 滚轮向上 = 前进
addEventListener('keydown', e => {
  if (!document.getElementById('loader').hidden) return;
  if (['ArrowDown', 'ArrowRight', ' '].includes(e.key)) { e.preventDefault(); camTarget = Math.min(MAX_T, Math.round(camTarget) + 1); }
  if (['ArrowUp', 'ArrowLeft'].includes(e.key)) { e.preventDefault(); camTarget = Math.max(0, Math.round(camTarget) - 1); }
  if (e.key === 'Home') camTarget = 0;
});
let dragY = null, dragMoved = false;
addEventListener('pointerdown', e => { if (!document.getElementById('loader').hidden || e.target.closest('a')) return; dragY = e.clientY; dragMoved = false; });
addEventListener('pointermove', e => {
  mouse.set((e.clientX / innerWidth - 0.5) * 2, -(e.clientY / innerHeight - 0.5) * 2);
  if (dragY !== null) { const dy = dragY - e.clientY; if (Math.abs(dy) > 3) dragMoved = true; move(dy / 160); dragY = e.clientY; }
});
addEventListener('pointerup', e => { if (dragY !== null) { dragY = null; snap(); if (!dragMoved) click(e); } });

const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
function click(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(panels, true).find(h => h.object.userData && h.object.userData.href);
  if (!hit) return;
  const { index, href } = hit.object.userData;
  if (Math.round(camTarget) !== index) { camTarget = index; return; }
  href.startsWith('http') ? open(href, '_blank', 'noreferrer') : (location.href = href);
}

/* ====================== HUD ====================== */
const hud = document.getElementById('hud');
let hudIndex = -1;
function updateHUD() {
  const i = Math.round(camT);
  if (i === hudIndex) return;
  const first = hudIndex === -1;
  hudIndex = i;
  const st = STOPS[i];
  const accent = i % 2 === 0 ? '#fcee0a' : '#ff2a6d';
  hud.style.setProperty('--accent', accent);
  hud.classList.toggle('center', st.kind === 'home');
  hud.classList.toggle('flip', i % 2 === 0 && !st.kind);
  const fill = () => {
    document.getElementById('hIdx').textContent = st.idx || `${String(i).padStart(2, '0')} / ${N - 2}  ·  ${st.type}`;
    document.getElementById('hTitle').textContent = st.title;
    document.getElementById('hLead').textContent = st.lead || '';
    document.getElementById('hBody').textContent = st.body || '';
    document.getElementById('hTags').innerHTML = (st.tags || []).map(t => `<span>${t}</span>`).join('');
    document.getElementById('hMeta').textContent = st.meta || st.stack || '';
    const links = st.links || [['OPEN PROJECT →', st.href]];
    document.getElementById('hLinks').innerHTML = links.map(([t, h, cls]) =>
      `<a href="${h}" class="${cls || ''}" ${h.startsWith('http') ? 'target="_blank" rel="noreferrer"' : ''} ${h === '#top' ? 'data-top="1"' : ''}>${t}</a>`).join('');
    hud.classList.remove('swap');
  };
  if (first) fill(); else { hud.classList.add('swap'); setTimeout(fill, 180); }
  document.getElementById('bar').style.height = `${(i / MAX_T) * 100}%`;
}
hud.addEventListener('click', e => { const a = e.target.closest('a[data-top]'); if (a) { e.preventDefault(); camTarget = 0; } });

/* ====================== 循环 ====================== */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
{ const at = Number(new URLSearchParams(location.search).get('at')); if (at > 0) camT = camTarget = Math.min(MAX_T, at - 1); }
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  stylize.uniforms.uTime.value = t / 1000;
  const a = rainGeo.attributes.position.array;
  for (let i = 1; i < a.length; i += 3) { a[i] -= dt * 14; if (a[i] < 0) a[i] += 30; }
  rainGeo.attributes.position.needsUpdate = true;
  for (const fn of animated) fn(dt);
  updateCamera(dt); updatePanels(dt); updateHUD();
  sky.position.copy(camera.position);
  composer.render();
  requestAnimationFrame(frame);
}

Promise.all([loadCity().then(() => { modelProgress = 1; updateLoading(); buildCity(); }), ...panelLoads])
  .then(() => {
    window.streetLoading.update(95, 'PREPARING SCENE');
    updateCamera(0); updatePanels(0); updateHUD(); sky.position.copy(camera.position);
    // The first render prepares visible materials instead of compiling the entire street.
    requestAnimationFrame(t => { frame(t); window.streetLoading.finish(); });
  })
  .catch(err => { console.error('Night Street failed to load', err); window.streetLoading.fail(); });
</script>
