<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zirui Zhao">
  <!-- 站点 logo 是一枚会转的锥形渐变方块（styles.css .pixel-square）。
       SVG 没有 conic-gradient，用四个三角拼出同样的四色轮转，配色取自同一组：
       #3b82f6 → #ec4899 → #f97316 → #3b82f6。 -->
  <rect width="64" height="64" rx="12" fill="#0f172a"/>
  <g transform="translate(32 32)">
    <path d="M0 0 L-18 -18 L18 -18 Z" fill="#3b82f6"/>
    <path d="M0 0 L18 -18 L18 18 Z" fill="#ec4899"/>
    <path d="M0 0 L18 18 L-18 18 Z" fill="#f97316"/>
    <path d="M0 0 L-18 18 L-18 -18 Z" fill="#3b82f6"/>
  </g>
</svg>
